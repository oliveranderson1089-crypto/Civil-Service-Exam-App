<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a6fb5">
<title>注册 · 公考助手</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<!-- 天光底：五层（稿纸格 / 晨晕 / 星子 / 山脊 / 纸感）由 js/daylight.js 的 dlPaintAuth
     按当前时刻画，和启动屏是同一张色表 —— 启动屏淡出落到这儿不换一块天。
     层的位置和尺寸在 auth.css 里；脚本没跑起来时，CSS 里那张静态晨光底还在。 -->
<div id="dl-sky" aria-hidden="true">
  <div class="dl-layer" id="dl-grid"></div>
  <div class="dl-layer" id="dl-bloom"></div>
  <div class="dl-layer" id="dl-stars"></div>
  <div class="dl-layer" id="dl-hill">
    <svg viewBox="0 0 100 42" preserveAspectRatio="none">
      <path d="M0 20 C 14 12, 24 18, 38 11 S 62 4, 74 12 S 90 18, 100 13 L100 42 L0 42Z" fill="#0d2a47" opacity=".95"/>
      <path d="M0 20 C 14 12, 24 18, 38 11 S 62 4, 74 12 S 90 18, 100 13" fill="none" stroke="#f0b429" stroke-width=".45" opacity=".6"/>
      <path d="M0 30 C 18 24, 30 30, 46 22 S 72 16, 86 24 S 96 27, 100 25 L100 42 L0 42Z" fill="#07172a"/>
    </svg>
  </div>
  <div class="dl-layer" id="dl-grain"></div>
</div>
<!-- 必须排在天光底**后面**：daylight.js 一执行就去找 #dl-sky，早一步就找不到、
     第一帧会是 CSS 那张静态兜底底（跨过黄昏时肉眼可见地不对） -->
<script src="js/daylight.js"></script>
<script src="js/auth.js"></script>
<form class="auth-box" id="form">
  <div class="auth-logo">公</div>
  <h1>注册公考助手</h1>
  <p class="sub" id="sub">创建你的账号</p>

  <label>用户名</label>
  <input id="u" type="text" autocomplete="username" placeholder="2 个字符以上">
  <div class="row2">
    <div><label>密码</label><input id="p" type="password" autocomplete="new-password" placeholder="至少 6 位"></div>
    <div><label>确认密码</label><input id="p2" type="password" autocomplete="new-password" placeholder="再输一次"></div>
  </div>
  <label>密保问题（忘记密码时用来重置）</label>
  <select id="secq"></select>
  <label>密保答案</label>
  <input id="seca" type="text" placeholder="请牢记，找回密码时要用">

  <div id="invite-row" style="display:none">
    <label>邀请码</label>
    <input id="invite" type="text" autocomplete="off" placeholder="请向管理员索取">
  </div>

  <label>验证码</label>
  <div class="cap-row">
    <input id="cap" type="text" inputmode="text" autocomplete="off" maxlength="4" placeholder="填右图 4 位">
    <img id="capimg" class="cap-img" alt="验证码" title="看不清？点击换一张">
  </div>

  <button type="submit" class="primary-btn" id="btn">注 册</button>
  <p class="err" id="err"></p>
  <a class="tolink" href="/login">已有账号？去登录</a>
</form>
<script>
const $ = (id) => document.getElementById(id);
fetch('/api/sec_questions').then(r => r.json()).then(d => {
  $('secq').innerHTML = d.questions.map(q => `<option>${q}</option>`).join('');
});
// 若已有用户，提示第一个注册者为管理员
fetch('/api/me').catch(() => {});
let capId = '';
async function loadCap() {
  try {
    const d = await (await fetch('/api/captcha')).json();
    capId = d.id; $('capimg').src = d.image; $('cap').value = '';
  } catch (_) {}
}
$('capimg').addEventListener('click', loadCap);
loadCap();
(async () => {
  try {
    const d = await (await fetch('/api/register/status')).json();
    if (!d.open) {
      $('form').innerHTML = `<div class="auth-logo">公</div>
  <h1>注册公考助手</h1>
  <p class="sub">注册暂未开放，如需账号请联系管理员。</p>
  <a class="tolink" href="/login">已有账号？去登录</a>`;
    } else if (d.invite) {
      $('invite-row').style.display = '';
    }
  } catch (_) {}
})();
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('err'); err.textContent = '';
  if ($('p').value !== $('p2').value) { err.textContent = '两次密码不一致'; return; }
  $('btn').disabled = true; $('btn').textContent = '注册中…';
  try {
    const r = await fetch('/api/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: $('u').value.trim(), password: $('p').value,
        sec_question: $('secq').value, sec_answer: $('seca').value.trim(),
        captcha_id: capId, captcha: $('cap').value.trim(),
        invite_code: $('invite').value.trim(),
      }),
    });
    const d = await r.json();
    if (r.ok) {
      if (d.role === 'admin') alert('你是第一个注册的用户，已设为管理员。');
      location.href = '/';
    } else { err.textContent = d.error || '注册失败'; loadCap(); }
  } catch (_) { err.textContent = '网络错误'; loadCap(); }
  $('btn').disabled = false; $('btn').textContent = '注 册';
});
</script>
</body>
</html>
