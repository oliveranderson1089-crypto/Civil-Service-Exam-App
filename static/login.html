<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a6fb5">
<title>登录 · 公考助手</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<!-- 天光底：五层（稿纸格 / 晨晕 / 星子 / 山脊 / 纸感）由 js/daylight.js 的 dlPaintAuth
     按当前时刻画，和启动屏是同一张色表 —— 启动屏淡出落到这儿不换一块天。
     层的位置和尺寸在 auth.css 里；脚本没跑起来时，CSS 里那张静态晨光底还在。 -->
<div id="dl-sky" aria-hidden="true">
  <div class="dl-layer" id="dl-grid"></div>
  <div class="dl-layer" id="dl-bloom"></div>
  <div class="dl-layer" id="dl-stars"></div>
  <div class="dl-layer" id="dl-hill">
    <svg viewBox="0 0 100 42" preserveAspectRatio="none">
      <path d="M0 20 C 14 12, 24 18, 38 11 S 62 4, 74 12 S 90 18, 100 13 L100 42 L0 42Z" fill="#0d2a47" opacity=".95"/>
      <path d="M0 20 C 14 12, 24 18, 38 11 S 62 4, 74 12 S 90 18, 100 13" fill="none" stroke="#f0b429" stroke-width=".45" opacity=".6"/>
      <path d="M0 30 C 18 24, 30 30, 46 22 S 72 16, 86 24 S 96 27, 100 25 L100 42 L0 42Z" fill="#07172a"/>
    </svg>
  </div>
  <div class="dl-layer" id="dl-grain"></div>
</div>
<!-- 必须排在天光底**后面**：daylight.js 一执行就去找 #dl-sky，早一步就找不到、
     第一帧会是 CSS 那张静态兜底底（跨过黄昏时肉眼可见地不对） -->
<script src="js/daylight.js"></script>
<script src="js/auth.js"></script>
<form class="login-box" id="form">
  <div class="login-logo">公</div>
  <h1>公考助手</h1>
  <p class="sub">请登录后使用</p>
  <label>用户名</label>
  <input id="u" type="text" autocomplete="username" placeholder="用户名" autofocus>
  <label>密码</label>
  <input id="p" type="password" autocomplete="current-password" placeholder="密码">
  <label>验证码</label>
  <div class="cap-row">
    <input id="cap" type="text" inputmode="text" autocomplete="off" maxlength="4" placeholder="填右图 4 位">
    <img id="capimg" class="cap-img" alt="验证码" title="看不清？点击换一张">
  </div>
  <button type="submit">登 录</button>
  <p class="err" id="err"></p>
  <p class="authrow">
    <a class="authlink" href="/register">注册新账号</a>
    <a class="authlink weak" href="/forgot">忘记密码？</a>
  </p>
</form>
<!-- 落款。楷体，和启动屏那句引言同一支字：两屏之间的接缝。 -->
<p class="dl-quote">“积累是慢的，但它是唯一算数的。”</p>
<script>
const form = document.getElementById('form');
const $ = (id) => document.getElementById(id);
let capId = '';
async function loadCap() {
  try {
    const d = await (await fetch('/api/captcha')).json();
    capId = d.id; $('capimg').src = d.image; $('cap').value = '';
  } catch (_) {}
}
$('capimg').addEventListener('click', loadCap);
loadCap();
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('err');
  err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: $('u').value,
        password: $('p').value,
        captcha_id: capId, captcha: $('cap').value.trim(),
      }),
    });
    const d = await r.json();
    if (r.ok) { location.href = '/'; }
    else { err.textContent = d.error || '登录失败'; loadCap(); }
  } catch (_) { err.textContent = '网络错误'; loadCap(); }
});
</script>
</body>
</html>
