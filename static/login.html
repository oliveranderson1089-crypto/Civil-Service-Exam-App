<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a6fb5">
<title>登录 · 公考助手</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;position:relative;
    background:linear-gradient(135deg,#1a6fb5,#2c8fd6);}
  /* 自定义登录壁纸（URL 缓存在 localStorage，未登录也能显示）；上面盖一层蒙版保证输入框看得清 */
  body.has-wall::before{content:"";position:fixed;inset:0;z-index:-2;
    background:var(--wall) center/cover no-repeat;}
  body.has-wall::after{content:"";position:fixed;inset:0;z-index:-1;
    background:rgba(10,25,45,var(--wall-dim,.55));}
  .login-box{background:#fff;border-radius:18px;padding:30px 26px;width:100%;
    max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:16px;}
  .login-logo{width:56px;height:56px;border-radius:14px;
    background:linear-gradient(135deg,#1a6fb5,#2c8fd6);color:#fff;display:grid;
    place-items:center;font-size:30px;font-weight:700;margin:0 auto 14px;}
  .login-box h1{font-size:19px;text-align:center;margin:0 0 4px;}
  .login-box p.sub{text-align:center;color:#8a93a3;font-size:13px;margin:0 0 22px;}
  .login-box label{display:block;font-size:13px;color:#666;margin:0 0 5px;}
  .login-box input{width:100%;padding:11px 13px;border:1.5px solid #e6e9ef;
    border-radius:10px;font-size:15px;outline:none;margin-bottom:15px;}
  .login-box input:focus{border-color:#1a6fb5;}
  .login-box button{width:100%;padding:12px;background:#1a6fb5;color:#fff;border:none;
    border-radius:10px;font-size:16px;cursor:pointer;}
  .login-box button:hover{background:#155a93;}
  .cap-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:15px;}
  .cap-row input{flex:1;margin-bottom:0;text-transform:uppercase;letter-spacing:2px;}
  .cap-img{height:46px;width:130px;border-radius:10px;border:1.5px solid #e6e9ef;cursor:pointer;background:#f5f8fc;}
  .err{color:#c0392b;font-size:13px;text-align:center;min-height:18px;margin:4px 0 0;}
</style>
</head>
<body>
<form class="login-box" id="form">
  <div class="login-logo">公</div>
  <h1>公考助手</h1>
  <p class="sub">请登录后使用</p>
  <label>用户名</label>
  <input id="u" type="text" autocomplete="username" placeholder="用户名" autofocus>
  <label>密码</label>
  <input id="p" type="password" autocomplete="current-password" placeholder="密码">
  <label>验证码</label>
  <div class="cap-row">
    <input id="cap" type="text" inputmode="text" autocomplete="off" maxlength="4" placeholder="填右图 4 位">
    <img id="capimg" class="cap-img" alt="验证码" title="看不清？点击换一张">
  </div>
  <button type="submit">登 录</button>
  <p class="err" id="err"></p>
  <p style="display:flex;justify-content:space-between;margin:12px 2px 0;">
    <a href="/register" style="color:#1a6fb5;font-size:13.5px;text-decoration:none;font-weight:600;">注册新账号</a>
    <a href="/forgot" style="color:#8a93a3;font-size:13px;text-decoration:none;">忘记密码？</a>
  </p>
</form>
<script>
/* 登录页壁纸：登录后 app 会把 URL 缓存到 localStorage，这里直接取（本页没登录，问不到接口） */
(function () {
  try {
    const w = localStorage.getItem('wallLogin');
    if (!w) return;
    const dim = Math.min(90, Math.max(0, parseInt(localStorage.getItem('skinDim') || '55', 10))) / 100;
    document.body.style.setProperty('--wall', 'url("' + w + '")');
    document.body.style.setProperty('--wall-dim', dim.toFixed(2));
    document.body.classList.add('has-wall');
  } catch (_) {}
})();
const form = document.getElementById('form');
const $ = (id) => document.getElementById(id);
let capId = '';
async function loadCap() {
  try {
    const d = await (await fetch('/api/captcha')).json();
    capId = d.id; $('capimg').src = d.image; $('cap').value = '';
  } catch (_) {}
}
$('capimg').addEventListener('click', loadCap);
loadCap();
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('err');
  err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: $('u').value,
        password: $('p').value,
        captcha_id: capId, captcha: $('cap').value.trim(),
      }),
    });
    const d = await r.json();
    if (r.ok) { location.href = '/'; }
    else { err.textContent = d.error || '登录失败'; loadCap(); }
  } catch (_) { err.textContent = '网络错误'; loadCap(); }
});
</script>
</body>
</html>
