<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a6fb5">
<title>找回密码 · 公考助手</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<!-- 天光底：五层（稿纸格 / 晨晕 / 星子 / 山脊 / 纸感）由 js/daylight.js 的 dlPaintAuth
     按当前时刻画，和启动屏是同一张色表 —— 启动屏淡出落到这儿不换一块天。
     层的位置和尺寸在 auth.css 里；脚本没跑起来时，CSS 里那张静态晨光底还在。 -->
<div id="dl-sky" aria-hidden="true">
  <div class="dl-layer" id="dl-grid"></div>
  <div class="dl-layer" id="dl-bloom"></div>
  <div class="dl-layer" id="dl-stars"></div>
  <div class="dl-layer" id="dl-hill">
    <svg viewBox="0 0 100 42" preserveAspectRatio="none">
      <path d="M0 20 C 14 12, 24 18, 38 11 S 62 4, 74 12 S 90 18, 100 13 L100 42 L0 42Z" fill="#0d2a47" opacity=".95"/>
      <path d="M0 20 C 14 12, 24 18, 38 11 S 62 4, 74 12 S 90 18, 100 13" fill="none" stroke="#f0b429" stroke-width=".45" opacity=".6"/>
      <path d="M0 30 C 18 24, 30 30, 46 22 S 72 16, 86 24 S 96 27, 100 25 L100 42 L0 42Z" fill="#07172a"/>
    </svg>
  </div>
  <div class="dl-layer" id="dl-grain"></div>
</div>
<!-- 必须排在天光底**后面**：daylight.js 一执行就去找 #dl-sky，早一步就找不到、
     第一帧会是 CSS 那张静态兜底底（跨过黄昏时肉眼可见地不对） -->
<script src="js/daylight.js"></script>
<script src="js/auth.js"></script>
<div class="auth-box">
  <div class="auth-logo">公</div>
  <h1>找回密码</h1>

  <!-- 第一步 -->
  <div id="step1">
    <label>用户名</label>
    <input id="u" type="text" placeholder="你的用户名">
    <button class="primary-btn" id="next">下一步</button>
  </div>

  <!-- 第二步 -->
  <form id="step2" class="hidden">
    <label>密保问题</label>
    <div class="qbox" id="question"></div>
    <label>你的答案</label>
    <input id="answer" type="text" placeholder="注册时设置的答案">
    <label>新密码</label>
    <input id="p" type="password" autocomplete="new-password" placeholder="至少 6 位">
    <button class="primary-btn" type="submit">重置密码</button>
  </form>

  <p class="msg" id="msg"></p>
  <a class="back" href="/login">← 返回登录</a>
</div>
<script>
const $ = (id) => document.getElementById(id);
function show(t, ok) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
$('next').addEventListener('click', async () => {
  const u = $('u').value.trim(); if (!u) { show('请填用户名'); return; }
  try {
    const r = await fetch('/api/forgot/question', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u }),
    });
    const d = await r.json();
    if (r.ok) { $('question').textContent = d.question; $('step1').classList.add('hidden'); $('step2').classList.remove('hidden'); show(''); }
    else show(d.error || '出错了');
  } catch (_) { show('网络错误'); }
});
$('step2').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const r = await fetch('/api/forgot/reset', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('u').value.trim(), answer: $('answer').value.trim(), password: $('p').value }),
    });
    const d = await r.json();
    if (r.ok) { show('密码已重置，正在跳转登录…', true); setTimeout(() => location.href = '/login', 1200); }
    else show(d.error || '重置失败');
  } catch (_) { show('网络错误'); }
});
</script>
</body>
</html>
